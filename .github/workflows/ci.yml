name: reference-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.0.2 scipy==1.14.1 scikit-learn==1.7.2 pandas==2.2.3 matplotlib==3.9.4 PyYAML==6.0.2
      - run: python scripts/extract_included_archives.py
      - run: python scripts/validate_datasets.py
      - run: make test
      - run: python scripts/smoke_test.py
      - run: python scripts/verify_integrity.py
